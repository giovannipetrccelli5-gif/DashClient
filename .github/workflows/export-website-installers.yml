name: Export website installer JARs
on:
  push:
    paths:
      - '.github/workflows/export-website-installers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve verified release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p installers
          gh release download dev-build --repo "${{ github.repository }}" --pattern 'dashclient-2.0.0-mc*.jar' --pattern 'DashClient-2.0.0-mc*.zip' --pattern 'DashClient-MicroMods-mc*.zip' --dir installers
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile
          versions=('1.21.11','26.1','26.1.1','26.1.2','26.2','26.3')
          for mc in versions:
              jar=Path('installers')/f'dashclient-2.0.0-mc{mc}.jar'
              assert jar.is_file(),jar
              with zipfile.ZipFile(jar) as z:
                  assert z.testzip() is None
                  d=json.loads(z.read('fabric.mod.json'))
                  assert d['depends']['minecraft']==mc
              for prefix in ('DashClient-2.0.0-mc','DashClient-MicroMods-mc'):
                  f=Path('installers')/(prefix+mc+'.zip')
                  assert f.is_file(),f
                  with zipfile.ZipFile(f) as z:
                      assert z.testzip() is None
          print("All 18 binary assets passed archive checks")
          PY
      - name: Store public-distribution files in isolated private export branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan website-installer-export-b64
          git rm -r -f . >/dev/null
          mkdir -p encoded
          for file in installers/*; do
            base64 -w 0 "$file" > "encoded/$(basename "$file").b64"
          done
          git add encoded
          git commit -m "Export 18 verified installers as transferable base64 text"
          git push origin HEAD:refs/heads/website-installer-export-b64 --force
