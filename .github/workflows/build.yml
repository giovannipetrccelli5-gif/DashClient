name: Build DashClient
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build client jar
        run: gradle build --no-daemon
      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: DashClient-jar
          path: build/libs/*.jar
      - name: Publish jar to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build build/libs/*.jar --clobber
          else
            gh release create dev-build build/libs/*.jar --target "$GITHUB_SHA" --title "DashClient development build" --prerelease --notes "Minecraft 26.3 Fabric client; automatically built from the main branch."
          fi
