name: DashClient 2 clean rebuild
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: dashclient-rebuild-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  matrix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Compile all six Minecraft editions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for mc in 1.21.11 26.1 26.1.1 26.1.2 26.2 26.3; do
            case "$mc" in
              1.21.11) api='0.141.6+1.21.11' ;;
              26.1) api='0.145.1+26.1' ;;
              26.1.1) api='0.145.4+26.1.1' ;;
              26.1.2) api='0.155.3+26.1.2' ;;
              26.2) api='0.161.0+26.2' ;;
              26.3) api='0.160.5+26.3' ;;
            esac
            git restore -- src/main/java build.gradle
            case "$mc" in
              1.21.11|26.1|26.1.1|26.1.2) python3 scripts/prepare_legacy_build.py "$mc" ;;
            esac
            gradle clean build --no-daemon -Pminecraft_version="$mc" -Pfabric_api_version="$api"
            cp build/libs/dashclient-2.0.0.jar "dist/dashclient-2.0.0-mc$mc.jar"
          done
      - name: Validate versions and create ZIP downloads
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          versions=('1.21.11','26.1','26.1.1','26.1.2','26.2','26.3')
          for version in versions:
              jar=Path('dist')/f'dashclient-2.0.0-mc{version}.jar'
              assert jar.is_file(),jar
              with zipfile.ZipFile(jar) as z:
                  meta=json.loads(z.read('fabric.mod.json'))
                  assert meta['version']=='2.0.0',meta
                  assert meta['depends']['minecraft']==version,meta
                  assert 'com/dashclient/DashClient.class' in z.namelist()
                  assert 'com/dashclient/ClientMenu.class' in z.namelist()
                  assert 'com/dashclient/HudEditor.class' in z.namelist()
              output=Path('dist')/f'DashClient-2.0.0-mc{version}.zip'
              with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as z:
                  z.write(jar,jar.name)
              with zipfile.ZipFile(output) as z:
                  assert z.testzip() is None
          print('All six versions compiled and validated.')
          PY
      - name: Publish downloads on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build dist/* --clobber
          else
            gh release create dev-build dist/* --target "$GITHUB_SHA" --title "DashClient 2 development builds" --prerelease --notes "Independent DashClient v2. Install only the JAR or ZIP for your exact Minecraft version."
          fi
