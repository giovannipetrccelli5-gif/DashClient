name: Build DashClient
on:
  push:
  pull_request:
  workflow_dispatch:

# Avoid older runs overwriting a newer development JAR.
concurrency:
  group: dashclient-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build and run tests
        run: gradle build --no-daemon
      - name: Audit module names and config keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, collections
          roots=Path('src/main/java/com/dashclient/modules')
          patterns=[
              r'\\bsuper\\("([^"]+)"\\)',
              r'\\b(?:add|style|item)\\(list,\\s*"([^"]+)"',
              r'\\b(?:add|hud)\\(modules,\\s*"([^"]+)"',
              r'\\binfo\\(out,\\s*"([^"]+)"',
              r'\\bnew Module\\("([^"]+)"',
          ]
          names=[]
          for file in roots.glob('*.java'):
              src=file.read_text(encoding='utf-8')
              for pattern in patterns:
                  for name in re.findall(pattern, src):
                      key=name.lower().replace(' ', '_').replace('/', '_')
                      names.append((key,name,file.name))
          grouped=collections.defaultdict(list)
          for key,name,file in names:
              grouped[key].append((name,file))
          collisions={key:values for key,values in grouped.items() if len(values)>1}
          assert len(names)>=250, f'Audit extracted too few module names: {len(names)}'
          assert not collisions, f'Duplicate module preference keys: {collisions}'
          assert all(0<len(name)<=120 for _,name,_ in names)
          print(f'Audited {len(names)} module identifiers: no duplicate preference keys')
          PY
      - name: Validate built JAR
        run: |
          python3 - <<'PY'
          import glob, json, zipfile
          jars = [p for p in glob.glob('build/libs/*.jar')
                  if not p.endswith('-sources.jar')]
          assert len(jars) == 1, f'Expected one mod JAR; found {jars}'
          with zipfile.ZipFile(jars[0]) as jar:
              manifest = json.loads(jar.read('fabric.mod.json'))
              assert manifest['id'] == 'dashclient'
              assert manifest['depends']['minecraft'] == '26.3'
              assert 'com/dashclient/DashClient.class' in jar.namelist()
              for name in ('InventoryPack', 'WorldPack', 'StatusPack',
                           'AdvancedHudPack', 'PerformanceModule',
                           'AdaptiveFpsModule', 'AdaptiveDistancePolicy',
                           'CombatVisualPack', 'AutoTotemModule',
                           'AutoElytraModule', 'ElytraFinderModule',
                           'ExpandedModulePack', 'AutoClickerModule',
                           'DeviceHealthPack', 'UtilityModulePack',
                           'QualityOfLifePack'):
                  assert f'com/dashclient/modules/{name}.class' in jar.namelist()
              for name in ('ClientFileInbox', 'ClientImportsScreen', 'DashScreen',
                           'DashSettingsScreen', 'ModuleHelp'):
                  assert f'com/dashclient/{name}.class' in jar.namelist()
          print('JAR structure and metadata verified:', jars[0])
          PY
      # Upload only when explicitly enabled: GitHub reports this account's artifact quota is full.
      # Optional repository Actions variable: DASHCLIENT_UPLOAD_ARTIFACT=true
      - name: Upload GitHub Actions artifact
        if: vars.DASHCLIENT_UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DashClient-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Create Android-friendly ZIP
        run: |
          python3 - <<'PY'
          import glob, pathlib, zipfile
          jars = [p for p in glob.glob('build/libs/dashclient-*.jar')
                  if not p.endswith('-sources.jar')]
          assert len(jars) == 1, f'Expected one mod JAR; got {jars}'
          with zipfile.ZipFile('DashClient-Phone-Download.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write(jars[0], arcname=pathlib.Path(jars[0]).name)
          with zipfile.ZipFile('DashClient-Phone-Download.zip') as z:
              assert z.testzip() is None
              assert z.namelist() == [pathlib.Path(jars[0]).name]
          PY
      - name: Publish jar and ZIP to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build build/libs/dashclient-*.jar DashClient-Phone-Download.zip --clobber
          else
            gh release create dev-build build/libs/dashclient-*.jar DashClient-Phone-Download.zip --target "$GITHUB_SHA" --title "DashClient development build" --prerelease --notes "Minecraft 26.3 Fabric client; automatically built from the main branch."
          fi
