name: Build DashClient
on:
  push:
  pull_request:
  workflow_dispatch:

# Avoid older runs overwriting a newer development JAR.
concurrency:
  group: dashclient-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build and run tests on 26.2 and 26.3
        run: |
          set -euo pipefail
          mkdir -p dist
          for mc in 26.2 26.3; do
            case "$mc" in
              26.2) api='0.161.0+26.2' ;;
              26.3) api='0.160.5+26.3' ;;
            esac
            echo "::group::Minecraft $mc / Fabric API $api"
            gradle clean build --no-daemon -Pminecraft_version="$mc" -Pfabric_api_version="$api"
            cp build/libs/dashclient-1.0.0.jar "dist/dashclient-1.0.0-mc$mc.jar"
            echo "::endgroup::"
          done
      - name: Audit module names and config keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, collections
          roots=Path('src/main/java/com/dashclient/modules')
          patterns=[
              r'\bsuper\("([^"]+)"\)',
              r'\b(?:add|style|item)\(list,\s*"([^"]+)"',
              r'\b(?:add|hud)\(modules,\s*"([^"]+)"',
              r'\binfo\(out,\s*"([^"]+)"',
              r'\bnew Module\("([^"]+)"',
          ]
          names=[]
          for file in roots.glob('*.java'):
              src=file.read_text(encoding='utf-8')
              for pattern in patterns:
                  for name in re.findall(pattern, src):
                      key=name.lower().replace(' ', '_').replace('/', '_')
                      names.append((key,name,file.name))
          grouped=collections.defaultdict(list)
          for key,name,file in names:
              grouped[key].append((name,file))
          collisions={key:values for key,values in grouped.items() if len(values)>1}
          assert len(names)>=250, f'Audit extracted too few module names: {len(names)}'
          assert not collisions, f'Duplicate module preference keys: {collisions}'
          assert all(0<len(name)<=120 for _,name,_ in names)
          print(f'Audited {len(names)} module identifiers: no duplicate preference keys')
          PY
      - name: Validate both built JARs and exact Minecraft dependencies
        run: |
          python3 - <<'PY'
          import json, pathlib, zipfile
          expected = {'26.2': '0.161.0+26.2', '26.3': '0.160.5+26.3'}
          for mc, api in expected.items():
              jar_path = pathlib.Path(f'dist/dashclient-1.0.0-mc{mc}.jar')
              assert jar_path.is_file(), f'Missing build: {jar_path}'
              with zipfile.ZipFile(jar_path) as jar:
                  names = set(jar.namelist())
                  manifest = json.loads(jar.read('fabric.mod.json'))
                  assert manifest['id'] == 'dashclient'
                  assert manifest['depends']['minecraft'] == mc, (jar_path, manifest)
                  assert manifest['depends']['fabric-api'] == '>=' + api, (jar_path, manifest)
                  assert 'com/dashclient/DashClient.class' in names
                  for name in ('InventoryPack', 'WorldPack', 'StatusPack',
                               'AdvancedHudPack', 'PerformanceModule',
                               'AdaptiveFpsModule', 'AdaptiveDistancePolicy',
                               'CombatVisualPack', 'AutoTotemModule',
                               'AutoElytraModule', 'ElytraFinderModule',
                               'ExpandedModulePack', 'AutoClickerModule', 'OreXrayModule',
                               'VillageFinderModule', 'FreecamModule', 'AutoMinerModule',
                               'DeviceHealthPack', 'UtilityModulePack',
                               'QualityOfLifePack'):
                      assert f'com/dashclient/modules/{name}.class' in names, name
                  for name in ('ClientFileInbox', 'ClientImportsScreen', 'DashScreen',
                               'DashSettingsScreen', 'ModuleHelp', 'AutoMinerScreen'):
                      assert f'com/dashclient/{name}.class' in names, name
                  assert 'dashclient.mixins.json' in names
                  for name in ('FreecamLookMixin', 'FreecamInteractionMixin'):
                      assert f'com/dashclient/mixin/{name}.class' in names
              print(f'Minecraft {mc}: metadata and JAR contents validated: {jar_path}')
          PY
      # Upload only when explicitly enabled: GitHub reports this account's artifact quota is full.
      # Optional repository Actions variable: DASHCLIENT_UPLOAD_ARTIFACT=true
      - name: Upload GitHub Actions artifact
        if: vars.DASHCLIENT_UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DashClient-26.2-and-26.3-jars
          path: dist/*.jar
          if-no-files-found: error
      - name: Create two Android-friendly ZIP downloads
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, shutil
          dist = pathlib.Path('dist')
          for mc in ('26.2', '26.3'):
              jar = dist / f'dashclient-1.0.0-mc{mc}.jar'
              zip_path = dist / f'DashClient-Phone-Download-mc{mc}.zip'
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
                  z.write(jar, arcname=jar.name)
              with zipfile.ZipFile(zip_path) as z:
                  assert z.testzip() is None
                  assert z.namelist() == [jar.name]
          # Preserve existing legacy download URLs, pointing to 26.3.
          shutil.copyfile(dist / 'dashclient-1.0.0-mc26.3.jar',
                          dist / 'dashclient-1.0.0.jar')
          shutil.copyfile(dist / 'DashClient-Phone-Download-mc26.3.zip',
                          dist / 'DashClient-Phone-Download.zip')
          PY
      - name: Publish jar and ZIP to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build dist/* --clobber
          else
            gh release create dev-build dist/* --target "$GITHUB_SHA" --title "DashClient development build" --prerelease --notes "Minecraft 26.2 and 26.3 Fabric client; choose the correct JAR for your Minecraft version. Automatically built and tested for both versions."
          fi
