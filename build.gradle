plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

processResources {
    // A different metadata file is produced for each Minecraft target. Do
    // not reuse a 26.3 manifest in a 26.2 build (or vice versa).
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "fabric_api_version", project.fabric_api_version
    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_version": project.minecraft_version,
            "fabric_api_version": project.fabric_api_version
        )
    }
}
// Minecraft 1.21.11 still runs on Java 21; releases 26.x use Java 25.
// Compile the 1.21.11 binary with a Java 21 bytecode target.
def targetJvm = (project.minecraft_version == '1.21.11') ? 21 : 25
tasks.withType(JavaCompile).configureEach {
    options.release = targetJvm
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.toVersion(targetJvm)
    targetCompatibility = JavaVersion.toVersion(targetJvm)
}
